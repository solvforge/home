intro: "I help businesses and individuals turn their ideas into reliable digital solutions — through website development, mobile app development, and ongoing website and ecommerce management. Alongside development, I provide SEO and marketing services to improve visibility and reach, set up and manage call center infrastructure, and handle server management and security. My focus is always on clear communication, honest work, and long-term support to help clients grow with confidence."
principles:
  - "[Principle one — e.g. direct communication, no account managers in between]"
  - "[Principle two — e.g. clear recurring pricing for management, clear quotes for projects]"
  - "[Principle three — e.g. one point of contact across hosting, security, and dev]"

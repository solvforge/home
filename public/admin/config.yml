backend:
  name: github
  repo: solvforge/home
  branch: main
  # Self-hosted OAuth (see /auth and /callback route handlers + docs/cms-setup.md)
  # — must match whatever domain is currently serving this site. Update this
  # when solvforge.com replaces the temporary Vercel preview domain.
  base_url: https://home-one-gray.vercel.app

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/home.yaml"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Subheadline", name: "subheadline", widget: "text" }
          - { label: "CTA Text", name: "ctaText", widget: "string" }
          - { label: "CTA Link", name: "ctaHref", widget: "string" }
      - file: "content/pages/about.yaml"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Principles"
            name: "principles"
            widget: "list"
            field: { label: "Principle", name: "principle", widget: "string" }
      - file: "content/pages/roadmap.yaml"
        label: "Roadmap / Notes"
        name: "roadmap"
        fields:
          - label: "Notes"
            name: "notes"
            widget: "list"
            field: { label: "Note", name: "note", widget: "text" }

  - name: "case-studies"
    label: "Case Studies"
    folder: "content/case-studies"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Client", name: "client", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Body", name: "body", widget: "markdown" }
